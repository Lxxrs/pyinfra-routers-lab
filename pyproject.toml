[project]
name = "pyinfra-routers-lab"
version = "0.3.0"
description = "Reproducible lab that provisions OpenBSD routers with pyinfra on Containerlab"
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pyinfra>=3.9.2",
]

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "ruff>=0.15.22",
    "ty>=0.0.62",
]

[tool.uv]
preview-features = ["audit-command", "check-command", "format-command", "lockfile-normalization", "malware-check"]
