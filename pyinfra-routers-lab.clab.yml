name: pyinfra-routers-lab
topology:
  nodes:
    router1:
      kind: openbsd
      image: ghcr.io/dteslya/vrnetlab-images/openbsd-vrnetlab:7.8
    router2:
      kind: openbsd
      image: ghcr.io/dteslya/vrnetlab-images/openbsd-vrnetlab:7.8
    client1:
      kind: "linux"
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip addr add 192.168.1.2/24 dev eth1
        - ip route add 192.168.2.0/24 via 192.168.1.1
    client2:
      kind: "linux"
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip addr add 192.168.2.2/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.2.1
  links:
    - endpoints: ["router1:eth1", "client1:eth1"]
    - endpoints: ["router2:eth1", "client2:eth1"]
    - endpoints: ["router1:eth2", "router2:eth2"]
